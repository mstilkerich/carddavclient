name: 'carddavclient-ci-setup'
description: 'Setup CardDavClient test environment'
inputs:
  php-version:
    description: 'PHP version to use'
    required: true
    default: '8.4'
  composer-flags:
    description: 'Additional flags for composer update (e.g. --prefer-lowest)'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          extensions: gd, xdebug, curl
          coverage: xdebug
      - name: Install dependencies
        run: composer update --no-interaction --no-progress ${{ inputs.composer-flags }}
        shell: bash
